version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: node dist/main.js
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/email_service?schema=public
      REDIS_HOST: redis
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    depends_on:
      - postgres
      - redis
      - mailhog

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: node dist/worker.js
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/email_service?schema=public
      REDIS_HOST: redis
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    depends_on:
      - postgres
      - redis
      - mailhog

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: email_service
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
